<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>전체 스캔 결과 · 오늘의 주식 탐험대</title><style>:root{--bg:#030605;--panel:#08110d;--line:#1c4432;--text:#f5fff8;--sub:#8fa399;--green:#00e783}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#082719 0,transparent 28%),var(--bg);color:var(--text);font:14px/1.5 system-ui,"Noto Sans KR",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1500px;margin:auto;padding:22px}.mast{display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{display:flex;align-items:center;gap:13px}.brand img{width:66px;height:66px;object-fit:contain}.brand h1{margin:0;font-size:30px}.brand h1 span{color:var(--green)}.sub{color:var(--sub)}.time{text-align:right;color:var(--sub)}.time b{display:block;color:#eafff2}.nav{display:flex;gap:17px;align-items:center;margin:20px 0;border-bottom:1px solid #183a2b;overflow-x:auto}.nav>a,.nav summary{padding:12px 3px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;list-style:none}.nav .on{color:var(--green);border-color:var(--green)}.drop{position:relative}.drop summary::-webkit-details-marker{display:none}.drop>div{position:absolute;z-index:20;top:45px;left:0;min-width:155px;padding:7px;border:1px solid var(--line);border-radius:12px;background:#07100c;box-shadow:0 16px 30px #000}.drop:not([open])>div{display:none}.drop div a{display:block;padding:8px 10px;border-radius:8px}.drop div a:hover{background:#0d2118;color:var(--green)}.system-bar{margin:0 0 18px;padding:9px 14px;border:1px solid #173829;border-radius:11px;background:#06100b;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--sub);font-size:12px}.system-status{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}.intro{margin:4px 0 18px}.intro h1{font-size:28px;margin:0 0 4px}.intro p{margin:0;color:var(--sub)}.summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:17px}.sum{min-height:118px;padding:14px;border:1px solid #223c31;border-radius:14px;background:linear-gradient(145deg,#07100c,#0a1510);color:var(--text);text-align:left;cursor:pointer}.sum:hover{border-color:var(--c)}.letter{display:flex;align-items:center;justify-content:center;width:31px;height:31px;border-radius:9px;border:1px solid var(--c);color:var(--c);font-weight:900}.sum strong{display:block;margin-top:9px;font-size:22px;color:var(--c)}.sum b{display:block;font-size:12px}.sum small{display:block;color:var(--sub);font-size:11px;margin-top:3px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px}.tab{flex:0 0 auto;border:1px solid #274638;border-radius:999px;background:#07100c;color:#b6c9c0;padding:7px 13px;cursor:pointer}.tab.on{background:var(--green);border-color:var(--green);color:#021009;font-weight:800}.table-wrap{border:1px solid #1d3b2d;border-radius:15px;background:#06100b;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1120px}.table th{position:sticky;top:0;z-index:2;background:#0a1610;color:#8fa399;font-size:11px;text-align:left;padding:11px 12px;border-bottom:1px solid #214333;white-space:nowrap}.table td{padding:12px;border-bottom:1px solid #142c21;vertical-align:middle}.table tbody tr:hover{background:#0a1912}.coin{min-width:145px}.coin b{display:block}.sym{display:block;color:var(--sub);font-size:11px}.badge{display:inline-flex;min-width:34px;justify-content:center;padding:3px 7px;border-radius:999px;border:1px solid var(--c);color:var(--c);font-weight:800}.setup{max-width:235px;font-size:12px}.setup small{display:block;color:var(--sub)}.levels{min-width:160px;font-size:11px;color:#c8d9d0}.levels span{display:block}.score{display:inline-flex;min-width:42px;justify-content:center;padding:4px 8px;border-radius:999px;background:#10231a;font-weight:800}.flow{min-width:220px;font-size:12px}.reason{min-width:280px;color:#9eb2a8;font-size:12px}.star{border:0;background:transparent;color:#ffd166;font-size:23px;cursor:pointer}@media(max-width:1100px){.summary{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.wrap{padding:12px}.brand img{width:54px;height:54px}.brand h1{font-size:23px}.time{font-size:10px}.system-bar{align-items:flex-start;flex-direction:column}.intro h1{font-size:24px}.summary{grid-template-columns:1fr 1fr}.table-wrap{margin-left:-12px;margin-right:-12px;border-left:0;border-right:0;border-radius:0}.drop>div{position:fixed;top:110px;left:12px}}</style></head><body><div class="wrap"><header class="mast"><a class="brand" href="index.html"><img src="../assets/sukdol-stage.webp"><div><h1>오늘의 주식 <span>탐험대</span></h1><p class="sub">한국주식 차트를 탐험하고, 볼 만한 모양을 발견하세요.</p></div></a><div class="time">데이터 기준일<b id="date">-</b>최근 업데이트<b id="updated">-</b></div></header><nav class="nav"><a href="index.html">메인 대시보드</a><details class="drop"><summary class="on">오늘의 전체 스캔 ▾</summary><div><a href="scan.html">전체 보기</a><a href="type_a.html">A형</a><a href="type_b.html">B형</a><a href="type_c.html">C형</a><a href="type_d.html">D형</a><a href="type_e.html">E형</a><a href="type_f.html">F형</a></div></details><details class="drop"><summary>훈련소 ▾</summary><div><a href="training_a.html">A형</a><a href="training_b.html">B형</a><a href="training_c.html">C형</a><a href="training_d.html">D형</a><a href="training_e.html">E형</a><a href="training_f.html">F형</a></div></details><a href="watchlist.html">관심종목 추적</a><a href="history.html">날짜별 기록</a></nav><div class="system-bar"><div class="system-status"><span class="dot"></span><b>KRX 일봉 스캐너 정상</b><span>· 분봉 미사용</span></div><div id="status">불러오는 중…</div></div><main><section class="intro"><h1>전체 스캔 결과</h1><p>오늘 탐색된 전체 종목을 유형별로 보고 원하는 흐름만 골라볼 수 있어.</p></section><section id="summary" class="summary"></section><div id="tabs" class="tabs"></div><div class="table-wrap"><table class="table"><thead><tr><th>종목</th><th>유형</th><th>현재가</th><th>신호/위치</th><th>핵심구간</th><th>점수</th><th>흐름</th><th>한줄정리</th><th>관심</th></tr></thead><tbody id="body"></tbody></table></div></main></div><script>const INFO={A:['#ff8297','급등 후 첫 눌림','강한 상승 → 첫 눌림 → 전고점 재도전 후보'],B:['#70c2ff','바닥·박스 하단 반등','장기 하락 → 바닥 횡보 → 하단 회복'],C:['#c3a7ff','박스 상단 돌파','박스 횡보 → 상단 반복 접촉 → 돌파'],D:['#5ce2b3','재탈환·압축','장기 하락 → 바닥 압축 → 매물대 재탈환 접근'],E:['#ffb454','급락 후 기술적 반등','급락·투매 → 하단 형성 → 기술적 반등 후보'],F:['#56d6ff','고점권·과거 매물대','신고가·고점권 상승 → 과거 횡보 매물대 접근']};let DATA={candidates:[],counts:{}};let filter='ALL';const fmt=v=>v==null?'-':typeof v==='number'?v.toLocaleString('ko-KR',{maximumFractionDigits:2}):String(v);function pins(){try{return JSON.parse(localStorage.getItem('ojutamPins')||'[]')}catch(e){return[]}}function toggle(c,b){let p=pins();p=p.includes(c)?p.filter(x=>x!==c):[...p,c];localStorage.setItem('ojutamPins',JSON.stringify(p));b.textContent=p.includes(c)?'★':'☆'}function levelText(r){const x=r.levels||{};return Object.entries(x).filter(([,v])=>typeof v==='number').slice(0,3).map(([k,v])=>`<span>${k.replaceAll('_',' ')} <b>${fmt(v)}</b></span>`).join('')||'-'}function lastPrice(r){const d=r.charts?.day||[];return d.length?d[d.length-1][4]:'-'}function render(){const c=DATA.counts||{};summary.innerHTML='ABCDEF'.split('').map(k=>`<button class="sum" style="--c:${INFO[k][0]}" onclick="setFilter('${k}')"><span class="letter">${k}</span><strong>${c[k]||0}</strong><b>${INFO[k][1]}</b><small>${INFO[k][2]}</small></button>`).join('');const total=(DATA.candidates||[]).length;tabs.innerHTML=['ALL',...'ABCDEF'].map(k=>`<button class="tab ${filter===k?'on':''}" onclick="setFilter('${k}')">${k==='ALL'?'ALL '+total:k+'형 '+(c[k]||0)}</button>`).join('');const p=pins();const rows=(DATA.candidates||[]).filter(r=>filter==='ALL'||r.type===filter);body.innerHTML=rows.map(r=>{const i=INFO[r.type]||['#00e783','',''];return `<tr><td class="coin"><b>${r.name||'-'}</b><span class="sym">${r.market||'-'} · ${r.exchange||'-'}</span></td><td><span class="badge" style="--c:${i[0]}">${r.type||'-'}형</span><span class="sym">${i[1]}</span></td><td><b>${fmt(lastPrice(r))}</b></td><td class="setup"><b>${i[1]}</b><small>${i[2]}</small></td><td class="levels">${levelText(r)}</td><td><span class="score">${fmt(r.score)}</span></td><td class="flow">${r.flow||'-'}</td><td class="reason">${r.reason||'-'}</td><td><button class="star" onclick="toggle('${r.market}',this)">${p.includes(r.market)?'★':'☆'}</button></td></tr>`}).join('')||'<tr><td colspan="9" style="padding:35px;text-align:center;color:#8fa399">현재 후보 없음</td></tr>'}function setFilter(k){filter=k;render()}fetch('latest.json?ts='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;date.textContent=d.market_date||'-';updated.textContent=(d.generated_at||'-').replace('T',' ').slice(0,16);status.textContent=`대상 ${fmt(d.universe_count)}종목 · 후보 ${(d.candidates||[]).length}개`;render()}).catch(()=>{status.textContent='데이터 로드 실패';render()});</script></body></html>
