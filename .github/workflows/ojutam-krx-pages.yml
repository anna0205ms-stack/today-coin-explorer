name: OJUTAM KRX Daily Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/ojutam_krx_daily.py"
      - "scanner/ojutam_krx_daily_v2.py"
      - "scanner/ojutam_krx_daily_v3.py"
      - "scanner/ojutam_krx_daily_v4.py"
      - "scanner/ojutam_krx_daily_v5.py"
      - "scanner/ojutam_krx_daily_v6.py"
      - "scanner/ojutam_krx_daily_v7.py"
      - "scanner/add_explorer_switch.py"
      - "scanner/ojutam_us_daily.py"
      - "scanner/add_ojutam_market_switch.py"
      - ".github/workflows/ojutam-krx-pages.yml"
  # KST weekdays: 15:40 after KRX close, 20:00 final refresh
  schedule:
    - cron: "40 6 * * 1-5"
    - cron: "0 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ojutam-public-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ojutam/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stock scanner dependencies
        run: pip install pandas numpy requests pyarrow yfinance
      - name: Scan KRX daily A-F and render OJUTAM
        env:
          TZ: Asia/Seoul
        run: python scanner/ojutam_krx_daily_v7.py
      - name: Scan NASDAQ daily A-F and render US OJUTAM
        env:
          TZ: Asia/Seoul
        run: python scanner/ojutam_us_daily.py
      - name: Add explorer and stock-market switches
        run: |
          python scanner/add_explorer_switch.py
          python scanner/add_ojutam_market_switch.py
      - name: Verify OJUTAM UI contract
        run: |
          set -e
          grep -q 'id="stockSearch"' outputs/ojutam/scan.html
          grep -q '종목명 또는 종목코드 검색' outputs/ojutam/scan.html
          grep -q '현재판단·남은 조건' outputs/ojutam/scan.html
          grep -q 'class=\"expand' outputs/ojutam/scan_v6.js
          grep -q 'toggleExpand' outputs/ojutam/scan_v6.js
          grep -q 'setOjutamQuery' outputs/ojutam/scan_v6.js
          grep -q '표적 이유' outputs/ojutam/scan_v6.js
          grep -q '차트 현재판단' outputs/ojutam/scan_v6.js
          grep -q '남은 조건' outputs/ojutam/scan_v6.js
          grep -q '<b>진입</b>' outputs/ojutam/scan_v6.js
          grep -q '<b>손절</b>' outputs/ojutam/scan_v6.js
          grep -q '<b>목표</b>' outputs/ojutam/scan_v6.js
          grep -q 'data-ojutam-filter="A"' outputs/ojutam/type_a.html
          grep -q 'data-ojutam-filter="F"' outputs/ojutam/type_f.html
          grep -q 'id="stockSearch"' outputs/ojutam/type_a.html
          if grep -q 'class="gallery"' outputs/ojutam/type_a.html; then
            echo "Type A still uses chart-first gallery"
            exit 1
          fi
          if grep -q 'id="detailModal"' outputs/ojutam/scan.html; then
            echo "Popup modal still present"
            exit 1
          fi
          grep -q '@media(max-width:760px)' outputs/ojutam/scan.html
          grep -q '>15분<' outputs/ojutam/index.html
          grep -q '>1시간<' outputs/ojutam/index.html
          grep -q '>4시간<' outputs/ojutam/index.html
          grep -q '>일봉<' outputs/ojutam/index.html
          grep -q '>주봉<' outputs/ojutam/index.html
          grep -q '오코탐 <span>| BTC</span>' outputs/ojutam/index.html
          grep -q '오주탐 <span>| STOCK</span>' outputs/ojutam/index.html
          test -f outputs/ojutam/us/index.html
          test -f outputs/ojutam/us/scan.html
          grep -q 'US100' outputs/ojutam/us/index.html
          grep -q 'DXY' outputs/ojutam/us/index.html
          grep -q 'data-index="us100"' outputs/ojutam/us/index.html
          grep -q 'data-index="dxy"' outputs/ojutam/us/index.html
          grep -q '미장 <span>| NASDAQ</span>' outputs/ojutam/us/index.html
          grep -q '국장 <span>| KRX</span>' outputs/ojutam/index.html
          grep -q 'id="stockSearch"' outputs/ojutam/us/scan.html
          grep -q 'ojutamPinsUS' outputs/ojutam/us/scan.html
          grep -q "draw('us100','D')" outputs/ojutam/us/index_us.js
          grep -q "draw('dxy','D')" outputs/ojutam/us/index_us.js
          grep -q 'index_us.js?v=20260902-us100-dxy-1' outputs/ojutam/us/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("outputs/ojutam/us/index_timeframes.json").read_text())
          assert {"us100","dxy"} <= data.keys()
          ndx=data["us100"]["D"]["rows"][-1]["close"]
          dxy=data["dxy"]["D"]["rows"][-1]["close"]
          assert ndx > 10_000, f"US100 does not look like Nasdaq-100: {ndx}"
          assert 50 < dxy < 200, f"DXY out of expected range: {dxy}"
          PY
      - name: Persist latest OJUTAM output
        run: |
          set -e
          git config user.name "OJUTAM Scanner"
          git config user.email "ojutam-scanner@users.noreply.github.com"
          git add outputs/ojutam/ history/ojutam_snapshots.json history/ojutam_us_snapshots.json
          if git diff --cached --quiet; then
            echo "No OJUTAM output changes"
          else
            git commit -m "ojutam: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            # add_explorer_switch.py may touch non-OJUTAM files; clear them before rebase.
            git restore --worktree .
            for n in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((n * 5))
              if [ "$n" = "3" ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy full site with OJUTAM
        id: deployment
        uses: actions/deploy-pages@v4
