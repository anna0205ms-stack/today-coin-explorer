name: OJUTAM KRX Daily Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/ojutam_krx_daily.py"
      - "scanner/ojutam_krx_daily_v2.py"
      - "scanner/ojutam_krx_daily_v3.py"
      - "scanner/ojutam_krx_daily_v4.py"
      - "scanner/ojutam_krx_daily_v5.py"
      - "scanner/ojutam_krx_daily_v6.py"
      - "scanner/ojutam_krx_daily_v7.py"
      - "scanner/ojutam_trade_tracker_ui.py"
      - "scanner/add_explorer_switch.py"
      - "scanner/release_footer.py"
      - "scanner/ojutam_market_calendar.py"
      - "scanner/ojutam_us_daily.py"
      - "scanner/add_ojutam_market_switch.py"
      - ".github/workflows/ojutam-krx-pages.yml"
  schedule:
    - cron: "40 6 * * 1-5"
    - cron: "0 11 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ojutam-public-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ojutam/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install stock scanner dependencies
        run: pip install pandas numpy requests pyarrow yfinance
      - name: Scan KRX daily A-F and render OJUTAM
        env:
          TZ: Asia/Seoul
        run: python scanner/ojutam_krx_daily_v7.py
      - name: Scan NASDAQ daily A-F and render US OJUTAM
        env:
          TZ: Asia/Seoul
        run: python scanner/ojutam_us_daily.py
      - name: Add trade tracker, switches, market holidays, and release footer
        run: |
          python scanner/ojutam_trade_tracker_ui.py
          python scanner/add_explorer_switch.py
          python scanner/add_ojutam_market_switch.py
          python scanner/ojutam_market_calendar.py
          python scanner/release_footer.py --product oju
      - name: Verify OJUTAM output, tracker, holidays, and footer on every page
        run: |
          set -e
          test -f outputs/ojutam/index.html
          test -f outputs/ojutam/scan.html
          test -f outputs/ojutam/watchlist.html
          test -f outputs/ojutam/trade_tracker.js
          test -f outputs/ojutam/us/index.html
          test -f outputs/ojutam/us/scan.html
          test -f outputs/ojutam/us/watchlist.html
          test -f outputs/ojutam/us/trade_tracker.js
          grep -q 'id="stockSearch"' outputs/ojutam/scan.html
          grep -q '현재판단·남은 조건' outputs/ojutam/scan.html
          grep -q 'OJUTAM-TRADE-TRACKER' outputs/ojutam/scan.html
          grep -q 'OJUTAM-TRADE-TRACKER' outputs/ojutam/us/scan.html
          grep -q 'OJUTAM-TRADE-TRACKER' outputs/ojutam/watchlist.html
          grep -q 'OJUTAM-TRADE-TRACKER' outputs/ojutam/us/watchlist.html
          grep -q '내 매매 추적 목록' outputs/ojutam/watchlist.html
          grep -q '내 매매 추적 목록' outputs/ojutam/us/watchlist.html
          grep -q "document.getElementById('watch')" outputs/ojutam/trade_tracker.js
          grep -q '당시 계획' outputs/ojutam/trade_tracker.js
          grep -q '현재 분석' outputs/ojutam/trade_tracker.js
          grep -q '실제 매수함' outputs/ojutam/trade_tracker.js
          grep -q 'US100' outputs/ojutam/us/index.html
          grep -q 'DXY' outputs/ojutam/us/index.html
          python - <<'PY'
          from pathlib import Path
          root=Path('outputs/ojutam')
          pages=list(root.rglob('*.html'))
          assert pages, 'no OJUTAM html pages generated'
          missing=[]
          wrong_footer=[]
          wrong_calendar=[]
          tracker_pages=[]
          tracker_missing=[]
          for p in pages:
              text=p.read_text(encoding='utf-8')
              rel=p.relative_to(root)
              is_us=bool(rel.parts and rel.parts[0]=='us')
              if 'Published by JIWON' not in text:
                  missing.append(str(p))
              if 'OJU LAB' not in text or 'Revision 12' not in text:
                  wrong_footer.append(str(p))
              expected='NASDAQ 휴장일' if is_us else 'KRX 휴장일'
              if 'OJUTAM-MARKET-CALENDAR:START' not in text or expected not in text:
                  wrong_calendar.append(str(p))
              should_have_tracker=('scan_v6.js' in text) or p.name=='watchlist.html'
              if should_have_tracker:
                  tracker_pages.append(str(p))
                  if 'OJUTAM-TRADE-TRACKER' not in text or 'trade_tracker.js' not in text:
                      tracker_missing.append(str(p))
          assert not missing, 'footer missing: ' + ', '.join(missing)
          assert not wrong_footer, 'OJU LAB/revision missing: ' + ', '.join(wrong_footer)
          assert not wrong_calendar, 'market holiday notice missing/wrong: ' + ', '.join(wrong_calendar)
          assert tracker_pages, 'no tracker pages found for verification'
          assert not tracker_missing, 'trade tracker missing: ' + ', '.join(tracker_missing)
          print(f'verified tracker + holiday notice + OJU LAB footer on all {len(pages)} OJUTAM pages; tracker on {len(tracker_pages)} pages including KRX/NASDAQ watchlists')
          PY
      - name: Persist latest OJUTAM output
        run: |
          set -e
          git config user.name "OJUTAM Scanner"
          git config user.email "ojutam-scanner@users.noreply.github.com"
          git add outputs/ojutam/ history/ojutam_snapshots.json history/ojutam_us_snapshots.json
          if git diff --cached --quiet; then
            echo "No OJUTAM output changes"
          else
            git commit -m "ojutam: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git restore --worktree .
            for n in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((n * 5))
              if [ "$n" = "3" ]; then exit 1; fi
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy full site with OJUTAM
        id: deployment
        uses: actions/deploy-pages@v4
