name: OJUTAM KRX Daily Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner/ojutam_krx_daily.py"
      - "scanner/ojutam_krx_daily_v2.py"
      - "scanner/ojutam_krx_daily_v3.py"
      - "scanner/ojutam_krx_daily_v4.py"
      - "scanner/ojutam_krx_daily_v5.py"
      - "scanner/ojutam_krx_daily_v6.py"
      - "scanner/ojutam_krx_daily_v7.py"
      - "outputs/ojutam/index_v6.js"
      - "outputs/ojutam/scan_v6.js"
      - ".github/workflows/ojutam-krx-pages.yml"
  schedule:
    - cron: "20 7 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ojutam-public-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ojutam/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install KRX daily dependencies
        run: pip install pandas numpy requests pyarrow yfinance
      - name: Scan KRX daily A-F and render OJUTAM
        env:
          TZ: Asia/Seoul
        run: python scanner/ojutam_krx_daily_v7.py
      - name: Verify OJUTAM UI contract
        run: |
          set -e
          grep -q 'class=\"expand' outputs/ojutam/scan_v6.js
          grep -q 'toggleExpand' outputs/ojutam/scan_v6.js
          if grep -q 'id="detailModal"' outputs/ojutam/scan.html; then
            echo "Popup modal still present"
            exit 1
          fi
          grep -q '>15분<' outputs/ojutam/index.html
          grep -q '>1시간<' outputs/ojutam/index.html
          grep -q '>4시간<' outputs/ojutam/index.html
          grep -q '>일봉<' outputs/ojutam/index.html
          grep -q '>주봉<' outputs/ojutam/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy full site with OJUTAM
        id: deployment
        uses: actions/deploy-pages@v4
