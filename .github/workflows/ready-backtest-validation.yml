name: READY Backtest Validation

on:
  push:
    branches:
      - ready-backtest-20260909
    paths:
      - 'ready_backtest/**'
      - '.github/workflows/ready-backtest-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'requests>=2.31' 'plotly>=5.24' 'pyarrow>=15'

      - name: Run KRX + UPBIT one-year READY backtest
        run: |
          python ready_backtest/ready_backtest_runner.py 2>&1 | tee ready_backtest/run.log

      - name: Print final summary
        if: always()
        run: |
          if [ -f ready_backtest/ready_backtest_results/FINAL_SUMMARY.json ]; then
            cat ready_backtest/ready_backtest_results/FINAL_SUMMARY.json
            echo '## READY Backtest Result' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ready_backtest/ready_backtest_results/FINAL_SUMMARY.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ready-backtest-results-20260909
          path: |
            ready_backtest/ready_backtest_results/**
            ready_backtest/run.log
          if-no-files-found: warn
          retention-days: 7
