name: Deploy OJUTAM Output

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "outputs/ojutam/**"
      - "scanner/add_explorer_switch.py"
      - ".github/workflows/deploy-ojutam-output.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ojutam/
    steps:
      - uses: actions/checkout@v4
      - name: Add OkoTam OjuTam switch
        run: python scanner/add_explorer_switch.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs
      - name: Deploy full site with OJUTAM
        id: deployment
        uses: actions/deploy-pages@v4
