name: BINANCE Spot ABCDE

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/binance-scan-and-pages.yml"
      - "scanner_binance/**"
      - "scanner/market_dashboard_v4.py"
      - "scanner/market_dashboard_v5.py"
      - "scanner/dashboard_v5.html"
      - "scanner/dashboard_v5.css"
      - "scanner/dashboard_v5.js"
      - "scanner/dashboard_asset_inliner.py"
      - "scanner/header_art.py"
      - "scanner/apply_space_header.py"
      - "outputs/assets/sukdol_*"
      - "README_BINANCE.md"
  schedule:
    - cron: "8,18,28,38 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: binance-spot-abcde
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 이번 Binance 4시간봉 실행 여부 확인
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scanner_binance/schedule_guard.py check >> "$GITHUB_OUTPUT"
          else
            python scanner_binance/schedule_guard.py check --force >> "$GITHUB_OUTPUT"
          fi
      - name: 이미 완료된 봉 안내
        if: steps.guard.outputs.should_run != 'true'
        run: echo "${{ steps.guard.outputs.slot }} Binance 봉은 이미 갱신되어 건너뜁니다."
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.12"
      - name: Scan BINANCE Spot USDT A/B/C/D/E
        if: steps.guard.outputs.should_run == 'true'
        env:
          BINANCE_MIN_24H_QUOTE_VOLUME: "2000000"
          BINANCE_MAX_SYMBOLS: "120"
        run: python scanner_binance/binance_spot_scanner.py
      - name: Render BINANCE dashboard
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python scanner_binance/render_dashboard.py
          python scanner/market_dashboard_v4.py
          python scanner/dashboard_asset_inliner.py
          python scanner/apply_space_header.py
          python scanner/market_dashboard_v5.py
      - name: Save BINANCE results
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "BINANCE Scanner"
          git config user.email "binance-scanner@users.noreply.github.com"
          git add outputs/binance outputs/index.html outputs/dashboard_v5.css outputs/dashboard_v5.js outputs/header_astronaut.b64 history/binance
          git diff --cached --quiet || git commit -m "binance scan: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.should_run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.should_run == 'true'
        with:
          path: outputs
      - name: Deploy dashboards
        if: steps.guard.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 게시 성공 Binance 봉 완료 처리
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python scanner_binance/schedule_guard.py mark --slot "${{ steps.guard.outputs.slot }}"
          git add history/binance/schedule_state.json
          git diff --cached --quiet || git commit -m "binance schedule: ${{ steps.guard.outputs.slot }} 완료"
          git pull --rebase origin main
          git push