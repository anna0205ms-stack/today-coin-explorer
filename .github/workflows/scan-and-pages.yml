name: UPBIT ABCD MVP Lite

on:
  schedule:
    # KST 01:10, 05:10, 09:10, 13:10, 17:10, 21:10
    - cron: "10 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: upbit-abcd-mvp-lite
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 소스 불러오기
        uses: actions/checkout@v4

      - name: Python 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 프로그램 설치
        run: pip install -r scanner/requirements.txt

      - name: A/B/C형 전체 스캔
        run: python scanner/box_screener.py

      - name: D형 전체 스캔
        run: >
          python scanner/pre_breakout_reclaim.py
          --all
          --workers 8
          --min-trade-amount 3000000000
          --output-json outputs/pre_breakout_reclaim.json
          --output-csv outputs/pre_breakout_reclaim.csv

      - name: BTC 분석과 화면 갱신
        run: |
          python scanner/bitcoin_regime.py
          python scanner/chart_cache.py
          python scanner/history_store.py
          python scanner/watchlist_store.py
          python scanner/outcome_tracker.py
          python scanner/unified_dashboard.py

      - name: 최신 스캔과 과거 기록 저장
        run: |
          git config user.name "오늘의 코인 탐험대"
          git config user.email "scanner@users.noreply.github.com"
          git add history/snapshots.json history/watchlist.json outputs/
          git diff --cached --quiet || git commit -m "자동 스캔 결과 갱신"
          git push

      - name: GitHub Pages 준비
        uses: actions/configure-pages@v5

      - name: 웹페이지 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: outputs

      - name: 웹사이트 게시
        id: deployment
        uses: actions/deploy-pages@v4
