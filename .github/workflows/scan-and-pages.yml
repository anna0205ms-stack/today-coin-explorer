# deploy refresh 2026-08-24 23:35 KST
name: UPBIT ABCDE MVP Lite

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan-and-pages.yml"
      - "scanner/schedule_guard.py"
      - "scanner/bitcoin_regime.py"
      - "scanner/btc_scenario.py"
      - "scanner/btc_scenario_dashboard.js"
      - "scanner/global_market_data.py"
      - "scanner/market_regime.py"
      - "scanner/history_store.py"
      - "scanner/watchlist_store.py"
      - "scanner/kakao_notifier.py"
      - "scanner/unified_dashboard.py"
      - "scanner/technical_rebound.py"
      - "scanner/global_supply.py"
      - "scanner/upbit_market_breadth.py"
      - "scanner/market_dashboard_v4.py"
      - "scanner/market_dashboard_v5.py"
      - "scanner/dashboard_v5.html"
      - "scanner/dashboard_v5.css"
      - "scanner/dashboard_v5.js"
      - "scanner/dashboard_asset_inliner.py"
      - "scanner/header_art.py"
      - "scanner/apply_space_header.py"
      - "scanner/add_explorer_switch.py"
      - "outputs/dashboard_v5.css"
      - "outputs/dashboard_v5.js"
      - "outputs/header_astronaut.b64"
      - "outputs/assets/cat_*"
      - "outputs/assets/sukdol_*"
  schedule:
    - cron: "3,13,23,33 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: upbit-abcd-mvp-lite
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 이번 4시간봉 실행 여부 확인
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scanner/schedule_guard.py check >> "$GITHUB_OUTPUT"
          else
            python scanner/schedule_guard.py check --force >> "$GITHUB_OUTPUT"
          fi
      - name: 이미 완료된 봉 안내
        if: steps.guard.outputs.should_run != 'true'
        run: echo "${{ steps.guard.outputs.slot }} 봉은 이미 갱신되어 건너뜁니다."
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.guard.outputs.should_run == 'true'
        run: pip install -r scanner/requirements.txt
      - name: Scan A/B/C
        if: steps.guard.outputs.should_run == 'true'
        run: python scanner/box_screener.py
      - name: Scan D
        if: steps.guard.outputs.should_run == 'true'
        run: python scanner/pre_breakout_reclaim.py --all --workers 8 --min-trade-amount 3000000000 --output-json outputs/pre_breakout_reclaim.json --output-csv outputs/pre_breakout_reclaim.csv
      - name: Scan E technical rebound
        if: steps.guard.outputs.should_run == 'true'
        run: python scanner/technical_rebound.py
      - name: Scan F global supply
        if: steps.guard.outputs.should_run == 'true'
        run: python scanner/global_supply.py --workers 8
      - name: Append record and render pages
        if: steps.guard.outputs.should_run == 'true'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_API_PLAN: ${{ vars.COINGECKO_API_PLAN }}
        run: |
          python scanner/bitcoin_regime.py
          python scanner/global_market_data.py
          python scanner/market_regime.py
          python scanner/btc_scenario.py
          python scanner/upbit_market_breadth.py
          python scanner/chart_cache.py
          python scanner/history_store.py
          python scanner/watchlist_store.py
          python scanner/outcome_tracker.py
          python scanner/unified_dashboard.py
          python scanner/market_dashboard_v4.py
          python scanner/dashboard_asset_inliner.py
          python scanner/apply_space_header.py
          python scanner/market_dashboard_v5.py
          python scanner/add_explorer_switch.py
      - name: Send selected Kakao alerts
        if: steps.guard.outputs.should_run == 'true'
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_WATCH_MARKETS: ${{ vars.KAKAO_WATCH_MARKETS }}
        run: |
          if [ -z "$KAKAO_REST_API_KEY" ] || [ -z "$KAKAO_REFRESH_TOKEN" ]; then exit 0; fi
          python scanner/kakao_notifier.py
      - name: Save latest scan and history
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "UPBIT Scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add history/snapshots.json history/global_market_snapshots.json history/watchlist.json history/btc_scenario_history.json outputs/
          if [ -f history/notification_state.json ]; then git add history/notification_state.json; fi
          git diff --cached --quiet || git commit -m "scan: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git pull --rebase origin main
          git push
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.should_run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.should_run == 'true'
        with:
          path: outputs
      - name: Deploy dashboard
        if: steps.guard.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 게시 성공 봉 완료 처리
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python scanner/schedule_guard.py mark --slot "${{ steps.guard.outputs.slot }}"
          git add history/schedule_state.json
          git diff --cached --quiet || git commit -m "schedule: ${{ steps.guard.outputs.slot }} 완료"
          git pull --rebase origin main
          git push
