name: UPBIT ABCD MVP Lite

on:
  # 자동화 코드가 바뀌면 즉시 1회 검증한다. 결과 파일 커밋에는 반응하지 않는다.
  push:
    branches: [main]
    paths:
      - ".github/workflows/scan-and-pages.yml"
      - "scanner/schedule_guard.py"
      - "scanner/bitcoin_regime.py"
      - "scanner/unified_dashboard.py"
  schedule:
    # GitHub 예약 지연·누락에 대비해 각 KST 4시간봉 마감 뒤 4회 재시도한다.
    # UTC 기준이며 실제 KST 실행 시각은 01/05/09/13/17/21시의 03·13·23·33분이다.
    - cron: "3,13,23,33 0,4,8,12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: upbit-abcd-mvp-lite
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 이번 4시간봉 실행 여부 확인
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scanner/schedule_guard.py check >> "$GITHUB_OUTPUT"
          else
            # 코드 수정 검증과 수동 실행은 이미 완료된 슬롯도 다시 생성한다.
            python scanner/schedule_guard.py check --force >> "$GITHUB_OUTPUT"
          fi

      - name: 이미 완료된 봉 안내
        if: steps.guard.outputs.should_run != 'true'
        run: echo "${{ steps.guard.outputs.slot }} 봉은 이미 갱신되어 건너뜁니다."

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.guard.outputs.should_run == 'true'
        run: pip install -r scanner/requirements.txt
      - name: Scan A/B/C
        if: steps.guard.outputs.should_run == 'true'
        run: python scanner/box_screener.py
      - name: Scan D
        if: steps.guard.outputs.should_run == 'true'
        run: python scanner/pre_breakout_reclaim.py --all --workers 8 --min-trade-amount 3000000000 --output-json outputs/pre_breakout_reclaim.json --output-csv outputs/pre_breakout_reclaim.csv
      - name: Append record and render pages
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python scanner/bitcoin_regime.py
          python scanner/chart_cache.py
          python scanner/history_store.py
          python scanner/watchlist_store.py
          python scanner/outcome_tracker.py
          python scanner/unified_dashboard.py
      - name: Send selected Kakao alerts
        if: steps.guard.outputs.should_run == 'true'
        # 알림 장애가 핵심 스캔·웹 게시를 막지 않게 분리한다.
        continue-on-error: true
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_WATCH_MARKETS: ${{ vars.KAKAO_WATCH_MARKETS }}
        run: |
          if [ -z "$KAKAO_REST_API_KEY" ] || [ -z "$KAKAO_REFRESH_TOKEN" ]; then
            echo "카카오 키가 아직 없어 알림만 건너뜁니다. 스캔과 웹 게시는 계속합니다."
            exit 0
          fi
          python scanner/kakao_notifier.py

      - name: Save latest scan and history
        if: steps.guard.outputs.should_run == 'true'
        run: |
          git config user.name "UPBIT Scanner"
          git config user.email "scanner@users.noreply.github.com"
          git add history/snapshots.json history/watchlist.json outputs/
          if [ -f history/notification_state.json ]; then
            git add history/notification_state.json
          fi
          git diff --cached --quiet || git commit -m "scan: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.should_run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.should_run == 'true'
        with:
          path: outputs
      - name: Deploy dashboard
        if: steps.guard.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 게시 성공 봉 완료 처리
        if: steps.guard.outputs.should_run == 'true'
        run: |
          python scanner/schedule_guard.py mark --slot "${{ steps.guard.outputs.slot }}"
          git add history/schedule_state.json
          git diff --cached --quiet || git commit -m "schedule: ${{ steps.guard.outputs.slot }} 완료"
          git push
